name: Download and self-host studio images

on:
  push:
    paths:
      - .github/workflows/localize-images.yml
      - scripts/localize-images.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download, optimize and localize all photos
        run: python scripts/localize-images.py
      - name: Validate and publish images
        run: |
          if grep -q 'avatars.mds.yandex.net' index.html; then
            echo "ERROR: external photos remain in index.html"
            exit 1
          fi
          test -n "$(find assets/photos -type f -name '*.webp' -print -quit)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/photos
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Self-host all Lenuel Nail studio photos"
            git push origin HEAD:main
          fi
